name: Bootstrap npm package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-agent-pantry-0.1.0 to publish the first npm version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirmation == 'publish-agent-pantry-0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Confirm version is not already published
        working-directory: packages/cli
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists; refusing to publish it again."
            exit 1
          fi

      - name: Publish first version with provenance
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
